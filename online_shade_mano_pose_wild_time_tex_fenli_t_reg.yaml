data:
  image_list:
  background_color: [0.0, 0.0, 0.0]
  cond_width: 252 # multiply of 14
  cond_height: 252

  relative_pose: false

  num_workers: 16
  eval_batch_size: 1
  eval_height: 256
  eval_width: 256

system:
  camera_embedder_cls: tgs.models.networks.MLP
  camera_embedder:
    dim_in: 25  # c2w + [fx, fy, cx, cy]
    dim_out: 768
    n_neurons: 768
    n_hidden_layers: 1
    activation: silu

  pose_embedder_cls: tgs.models.networks.MLP
  pose_embedder:
    dim_in: 96  # c2w + [fx, fy, cx, cy]
    dim_out: 768
    n_neurons: 768
    n_hidden_layers: 1
    activation: silu

  time_embedder_cls: tgs.models.networks.MLP
  time_embedder:
    dim_in: 9  # c2w + [fx, fy, cx, cy]
    dim_out: 256
    n_neurons: 256
    n_hidden_layers: 1
    activation: silu

  image_feature:
    out_dim: 773

  add_time_bias: True

  image_tokenizer_cls: tgs.models.tokenizers.image.DINOV2SingleImageTokenizer
  image_tokenizer:
    pretrained_model_name_or_path: "facebook/dinov2-base"
    width: ${data.cond_width}
    height: ${data.cond_height}

    modulation: true
    modulation_zero_init: true
    modulation_single_layer: true
    modulation_cond_dim: ${system.camera_embedder.dim_out} # c2w + intrinsic

    freeze_backbone_params: false
    enable_memory_efficient_attention: ${system.backbone.enable_memory_efficient_attention}
    enable_gradient_checkpointing: ${system.backbone.gradient_checkpointing}

  tokenizer_shade_cls: tgs.models.tokenizers.triplane_texture.TriplaneLearnablePositionalEmbedding
  tokenizer_shade:
    plane_size: 32
    num_channels: 512
    n_plane: 2

  tokenizer_texture_cls: tgs.models.tokenizers.triplane_texture.TriplaneLearnablePositionalEmbedding
  tokenizer_texture:
    plane_size: 32
    num_channels: 512
    n_plane: 2

  backbone_cls: tgs.models.transformers.Transformer1D
  backbone:
    in_channels: ${system.tokenizer_texture.num_channels}
    num_attention_heads: 8
    attention_head_dim: 64
    num_layers: 10
    cross_attention_dim: 512 # hard-code, =DINO feature dim

    norm_type: "layer_norm"

    enable_memory_efficient_attention: false
    gradient_checkpointing: false

  backbone_shade_cls: tgs.models.transformers.Transformer1D
  backbone_shade:
    in_channels: ${system.tokenizer_texture.num_channels}
    num_attention_heads: 8
    attention_head_dim: 64
    num_layers: 10
    cross_attention_dim: 512 # hard-code, =DINO feature dim

    norm_type: "layer_norm"

    enable_memory_efficient_attention: false
    gradient_checkpointing: false

  post_processor_cls: tgs.models.networks.TriplaneUpsampleNetwork
  post_processor:
    in_channels: ${system.tokenizer_texture.num_channels}
    out_channels: 80

  post_processor_texture_cls: tgs.models.networks_texture.TriplaneUpsampleNetwork
  post_processor_texture:
    in_channels:  512
    out_channels: 256
    out_channels_2: 128
    out_channels_3: 64
    out_channels_4: 32
    n_plane: ${system.tokenizer_texture.n_plane}

  pointcloud_generator_cls: tgs.models.pointclouds.simplepoint.SimplePointGenerator
  pointcloud_generator:
    camera_embedder_cls: tgs.models.networks.MLP
    camera_embedder:
      dim_in: 25  # c2w + [fx, fy, cx, cy]
      dim_out: 768
      n_neurons: 768
      n_hidden_layers: 1
      activation: silu

    image_tokenizer_cls: tgs.models.tokenizers.image.DINOV2SingleImageTokenizer
    image_tokenizer:
      pretrained_model_name_or_path: "facebook/dinov2-base"
      width: ${data.cond_width}
      height: ${data.cond_height}

      modulation: true
      modulation_zero_init: true
      modulation_single_layer: true
      modulation_cond_dim: ${system.camera_embedder.dim_out} # c2w + intrinsic

      freeze_backbone_params: true
      enable_memory_efficient_attention: ${system.backbone.enable_memory_efficient_attention}
      enable_gradient_checkpointing: false

    tokenizer_cls: tgs.models.tokenizers.point.PointLearnablePositionalEmbedding
    tokenizer:
      num_pcl: 2048
      num_channels: 512

    backbone_cls: tgs.models.transformers.Transformer1D
    backbone:
      in_channels: 512
      num_attention_heads: 8
      attention_head_dim: 64
      num_layers: 10
      cross_attention_dim: 512 # hard-code, =DINO feature dim

      norm_type: "layer_norm"

      enable_memory_efficient_attention: ${system.backbone.enable_memory_efficient_attention}
      gradient_checkpointing: ${system.backbone.gradient_checkpointing}

    post_processor_cls: tgs.models.networks.PointOutLayer
    post_processor:
      in_channels: 512
      out_channels: 3

    pointcloud_upsampling_cls: tgs.models.snowflake.model_spdpp_my.SnowflakeModelSPDPP
    pointcloud_upsampling:
      input_channels: 512
      dim_feat: 128
      num_p0: 2048
      radius: 1
      bounding: true
      use_fps: true
      up_factors: [2,4]
      token_type: "image_token"

  pointcloud_encoder_shade_cls: tgs.models.pointclouds.pointnet_texture.LocalPoolPointnet
  pointcloud_encoder_shade:
    input_channels: 788 # 3 + 3 + 768 + 1 + 1 [xyz, local features]
    c_dim: ${system.tokenizer_shade.num_channels}
    hidden_dim: 128
    plane_size: ${system.tokenizer_shade.plane_size}
    n_blocks: 5
    radius: ${system.renderer.radius}

  pointcloud_encoder_texture_cls: tgs.models.pointclouds.pointnet_texture.LocalPoolPointnet
  pointcloud_encoder_texture:
    input_channels: 53 # 3 + 3 + 768 + 1 + 1 [xyz, local features]
    c_dim: ${system.tokenizer_texture.num_channels}
    hidden_dim: 128
    plane_size: ${system.tokenizer_texture.plane_size}
    n_blocks: 5
    radius: ${system.renderer.radius_texture}

  smpl_cfg:
    model_type: 'mano'
    flat_hand_mean: True
    gender: 'neutral'
    use_pca: False
    # is_rhand: True
    center_id: 4
    scale: 10.
    seal: True
    distal: True
    num_betas: 10
    model_path: '.'
    pairof_name: 'handavatar.core.nets.handavatar.pairof.pairof_render'
    pairof_pretrain: 'pairof/out/pretrained_pairof/pairof.ckpt'
    neighbor: 4
    n_samples: 256
    extended_dist: 0.01
    local_en_dim: 64
    part_en_dim: 64
    en_part_normal: True
    fusion_pool: False
    decoder_layer: [4, 128]
    inbox_feat: False
    pre_train: ''
    level_set: 0.5
    bbox_padding: 2.0
    sigma: 0.05
    soft_beta: 0.05
    softmax_out: True
    manohd: 3
    lbs_weights: 'smplx/out/pretrained_lbs_weights/lbs_weights.pth'
    global_sample_num: 4096
    ignore_deform: False

  deform_network:
    module: 'tgs.deform_network.deform_network.DeformNetwork'
    feature_vector_size: 45
    d_in: 3
    d_out: 3
    dims: [128, 128, 128, 128]
    multires: 6
    embedder: 'tgs.embedders.embedder'
    hidden_feats: 256
    hidden_layers: 6
    in_feat: 35
    cond_feats: 135
    num_verts: 49281
    normal_frame: False

  renderer_cls: tgs.models.renderer_online_shade_fenli_mano_time.GS3DRenderer
  renderer:
    sh_degree: 3
    radius: 0.2
    radius_texture: 1.0
    mlp_network_config:
      n_neurons: ${system.renderer.gs_out.in_channels}
      n_hidden_layers: 2
      activation: silu
    gs_out:
      in_channels: 256
      xyz_offset: true
      restrict_offset: true
      use_rgb: true
      time_weight: True
      time_reg: True
      feature_channels:
        xyz: 3
        scaling: 3
        rotation: 4
        opacity: 1
        shs: ${shsdim:${system.renderer.sh_degree}}
        # xyz_bias: 3
        # scaling_bias: 3
        # rotation_bias: 4
        # opacity_bias: 1
        # shs_bias: ${shsdim:${system.renderer.sh_degree}}
      # clip_scaling: 0.2